nombre = "Topstep 50K (XFA estándar)"
aviso = "Reglas recopiladas el 26-sep-2026. Verifica en help.topstep.com antes de comprar."

[[fase]]
nombre = "Trading Combine"
capital_inicial = 50000
objetivo_beneficio = 3000          # (oficial)
drawdown_maximo = 2000             # (oficial) Maximum Loss Limit, se actualiza al cierre
tipo_drawdown = "trailing_cierre"  # (oficial) vigilado en tiempo real incluyendo flotante
