ganancia_minima_dia = 150
drawdown_maximo = 2000             # (oficial)
tipo_drawdown = "trailing_cierre"
bloqueo_drawdown = 0               # (supuesto)
max_contratos = 5

[economia]
coste_evaluacion = 49              # (oficial, precio de entrada actual) por mes hasta aprobar
cobro_evaluacion = "mensual"
