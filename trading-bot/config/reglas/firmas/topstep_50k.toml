consistencia_max_dia = 0.5         # (oficial, verificar %: 50–55 %) si se supera, sube el objetivo
dias_minimos = 2                   # (supuesto)
max_contratos = 5                  # (supuesto) 5 minis / 50 micros

[fondeada]
nombre = "Express Funded Account"
capital_inicial = 50000
