<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago realizado · MESAGRANDE</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--bg2:#161616;--border:#2a2a2a;--text:#f0f0f0;--text3:#555;--accent:#e8ff47;--green:#4fff8f;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.card{width:100%;max-width:400px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:2.5rem 2rem;text-align:center}
.ico{width:64px;height:64px;border-radius:50%;background:rgba(79,255,143,.12);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 1.25rem}
h1{font-size:20px;font-weight:600;margin-bottom:6px}
.sub{font-size:13px;color:var(--text3);margin-bottom:1.5rem}
.order{font-family:var(--mono);font-size:12px;color:var(--text3);margin-bottom:1.75rem}
.order b{color:var(--text)}
.btn{display:inline-block;padding:11px 20px;border-radius:8px;background:var(--accent);color:#0f0f0f;text-decoration:none;font-weight:600;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <div class="ico">✓</div>
  <h1>Pago realizado</h1>
  <div class="sub">El cobro se ha completado correctamente en el TPV de Redsys.</div>
  <div class="order" id="order"></div>
  <a class="btn" href="/">Volver a MESAGRANDE</a>
</div>
<script>
const o = new URLSearchParams(location.search).get('order')
if (o) document.getElementById('order').innerHTML = 'Pedido&nbsp; <b>#'+o+'</b>'
</script>
</body>
</html>
